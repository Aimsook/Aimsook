name: Generate Snake

on:
  schedule:
    # run every day at 00:00 UTC
    - cron: "0 0 * * *"
  # allow manual run from the Actions tab
  workflow_dispatch:
  # run when the default branch is updated
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (Chelsea blue board, Conan red snake)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D32F2F&color_dots=#ebedf0,#b9d3f5,#7fb0ec,#4A90E2,#034694
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D32F2F&color_dots=#161b22,#0b2a5b,#034694,#2d6bc4,#4A90E2

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
